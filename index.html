<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1WIN MINES ULTRA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-layer deep-bg" id="deepBg"></div>
    <div class="bg-layer grid-overlay" id="gridOverlay"></div>

    <div class="phone-container">
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="loading-text" id="loaderText">SYNCING...</div>
        </div>

        <div class="header-section">
            <div class="banner-frame">
                <img class="banner-img" src="banner.jpg" alt="Arena">
            </div>
            <div class="logo">1WIN<span>MINES</span></div>
            <div class="subtitle">AI GYRO-VECTOR V5.2</div>
        </div>

        <div class="screen active" id="loginScreen">
            <div class="input-group">
                <label>PLAYER ID</label>
                <input type="number" id="userId" placeholder="Enter ID...">
            </div>
            <button class="btn" onclick="verifyId()">INITIALIZE</button>
        </div>

        <div class="screen" id="predictorScreen">
            <div class="status-panel">MATRIX SECURED // <span id="displayId">000</span></div>
            <div class="input-group">
                <label>MINES COUNT</label>
                <select id="mineCount">
                    <option value="1">1 MINE</option>
                    <option value="3" selected>3 MINES</option>
                    <option value="5">5 MINES</option>
                    <option value="7">7 MINES</option>
                </select>
            </div>
            <div class="grid-container" id="grid"></div>
            <button class="btn predict-btn" onclick="generatePrediction()">SCAN SEED</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
