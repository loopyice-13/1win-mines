<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1WIN MINES PREDICTOR ULTRA</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Custom Cinematic Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LAYER 1: Deep Cinematic Backdrop -->
    <div class="bg-layer deep-bg" id="deepBg"></div>
    
    <!-- LAYER 2: Floating Digital Grid Overlay -->
    <div class="bg-layer grid-overlay" id="gridOverlay"></div>

    <!-- LAYER 3: Main Game UI Container -->
    <div class="phone-container">
        
        <!-- Interactive Loader Screen -->
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="loading-text" id="loaderText">Establishing Quantum Link...</div>
        </div>

        <!-- Banner & Header branding -->
        <div>
            <div class="banner-frame">
                <div class="banner-glare"></div>
                <img class="banner-img" src="banner.jpg" alt="1Win Arena">
            </div>
            <div class="header">
                <div class="logo">1WIN<span>MINES</span></div>
                <div class="subtitle">AI Gyro-Vector v5.2</div>
            </div>
        </div>

        <!-- SCREEN 1: ID GATEKEEPER -->
        <div class="screen active" id="loginScreen">
            <div class="instruction-text">
                Authenticate your 1win player ID to synchronize the real-time predictive grid matrix.
            </div>
            
            <div class="input-group">
                <label for="userId">Account Player ID</label>
                <input type="number" id="userId" placeholder="Enter 1win ID..." autocomplete="off">
            </div>

            <button class="btn" id="authBtn">INITIALIZE NEURO-LINK</button>
        </div>

        <!-- SCREEN 2: ACTIVE PREDICTOR PANEL -->
        <div class="screen" id="predictorScreen">
            <div class="status-panel">
                MATRIX SECURED // ID: <span id="displayId">000000</span>
            </div>

            <div class="input-group">
                <label for="mineCount">Active Traps Configured</label>
                <select id="mineCount">
                    <option value="1">1 Mine</option>
                    <option value="3" selected>3 Mines</option>
                    <option value="5">5 Mines</option>
                    <option value="7">7 Mines</option>
                </select>
            </div>

            <!-- 5x5 Prediction Board -->
            <div class="grid-container" id="grid"></div>

            <button class="btn btn-predict" id="predictBtn">SCAN QUANTUM SEED</button>
        </div>

        <!-- Footer Meta Info -->
        <div class="footer-note">
            SECURE TELEGRAM WEB APP PROTOCOL • ENCRYPTED NODE
        </div>
    </div>

    <!-- Main JavaScript Logic Engine -->
    <script src="script.js"></script>
</body>
</html>
